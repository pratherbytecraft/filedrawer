<!-- App icon: the same mark as icon.svg with margin, so the badge sits at
     82% of the canvas like ClipShot's, per macOS icon sizing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120"><stop offset="0%" stop-color="#9fa8ff"/><stop offset="55%" stop-color="#5865F2"/><stop offset="100%" stop-color="#4c46d6"/></linearGradient>
    <linearGradient id="manila" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="90"><stop offset="0%" stop-color="#ffe9a6"/><stop offset="100%" stop-color="#f0a43a"/></linearGradient>
  </defs>
  <g transform="translate(60 60) scale(0.82) translate(-60 -60)">
    <circle cx="60" cy="60" r="54" fill="#0b0e1a" stroke="url(#ring)" stroke-width="4"/>
    <path d="M24 40 V86 A4 4 0 0 0 28 90 H92 A4 4 0 0 0 96 86 V46 A4 4 0 0 0 92 42 H62 L55 34 H28 A4 4 0 0 0 24 38 Z" fill="url(#manila)"/>
    <path d="M24 50 H96" stroke="#0b0e1a" stroke-opacity=".2" stroke-width="2"/>
    <path d="M60 52 V84" stroke="#5865F2" stroke-width="5" stroke-linecap="round"/>
    <path d="M32 62 H52 M32 72 H48 M68 62 H88 M68 72 H84" stroke="#0b0e1a" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
