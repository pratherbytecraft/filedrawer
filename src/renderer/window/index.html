<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Filedrawer</title>
<link rel="stylesheet" href="window.css">
<link rel="stylesheet" id="theme-css" href="../themes/system.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-manila" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde79a"/><stop offset="1" stop-color="#f1c447"/></linearGradient>
    <linearGradient id="g-macfolder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3ff"/><stop offset="1" stop-color="#6cb6f5"/></linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdc6a"/><stop offset="1" stop-color="#2f9a1c"/></linearGradient>
    <linearGradient id="g-grey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6d6d6"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient>

    <symbol id="i-folder" viewBox="0 0 32 32">
      <path d="M2 7.5A1.5 1.5 0 0 1 3.5 6h8l2.5 3h14.5A1.5 1.5 0 0 1 30 10.5V25a1.5 1.5 0 0 1-1.5 1.5h-25A1.5 1.5 0 0 1 2 25z" style="fill:var(--fold-back)"/>
      <path d="M2 12.5A1.5 1.5 0 0 1 3.5 11h25a1.5 1.5 0 0 1 1.5 1.5V25a1.5 1.5 0 0 1-1.5 1.5h-25A1.5 1.5 0 0 1 2 25z" style="fill:var(--fold-front);stroke:var(--fold-line);stroke-width:.6"/>
    </symbol>
    <symbol id="t-back" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" style="fill:var(--round-bg);stroke:var(--round-ring)"/>
      <path d="M13.5 7l-5 5 5 5" style="stroke:var(--round-ink)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-forward" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" style="fill:var(--round-bg);stroke:var(--round-ring)"/>
      <path d="M10.5 7l5 5-5 5" style="stroke:var(--round-ink)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-up" viewBox="0 0 24 24">
      <path d="M2 6.5A1 1 0 0 1 3 5.5h6l2 2h10a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" style="fill:var(--fold-back)"/>
      <path d="M2 10a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" style="fill:var(--fold-front);stroke:var(--fold-line);stroke-width:.5"/>
      <path d="M12 18v-7M8.5 14l3.5-3.5 3.5 3.5" stroke="#2f9a1c" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-go" viewBox="0 0 24 24">
      <rect x="1.5" y="1.5" width="21" height="21" rx="3" style="fill:var(--round-bg);stroke:var(--round-ring)"/>
      <path d="M7 12h10M13 7.5l4.5 4.5-4.5 4.5" style="stroke:var(--round-ink)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="t-views" viewBox="0 0 24 24">
      <rect x="3" y="3" width="8" height="8" rx="1" fill="#5b8fe0" stroke="#2a5aa8"/>
      <rect x="13" y="3" width="8" height="8" rx="1" fill="#e8b84a" stroke="#b9821b"/>
      <rect x="3" y="13" width="8" height="8" rx="1" fill="#6cc04a" stroke="#2f8a1c"/>
      <rect x="13" y="13" width="8" height="8" rx="1" fill="#d9534f" stroke="#a52a26"/>
    </symbol>
    <symbol id="t-drop" viewBox="0 0 8 8"><path d="M0 2h8L4 6.5z" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="titlebar">
  <svg class="t-icon"><use href="#i-folder"/></svg>
  <div class="title" id="title"></div>
</div>

<div class="toolbar">
  <div class="tb off" id="b-back" title="Back"><svg class="ic"><use href="#t-back"/></svg><span class="lb">Back</span><span class="tb-drop" data-drop="back"><svg class="drop"><use href="#t-drop"/></svg></span></div>
  <div class="tb off" id="b-forward" title="Forward"><svg class="ic"><use href="#t-forward"/></svg><span class="tb-drop" data-drop="forward"><svg class="drop"><use href="#t-drop"/></svg></span></div>
  <div class="tb" id="b-up" title="Up"><svg class="ic"><use href="#t-up"/></svg></div>
  <div class="tbsep"></div>
  <div class="tb" id="b-views" title="Views"><svg class="ic"><use href="#t-views"/></svg><span class="tb-drop"><svg class="drop"><use href="#t-drop"/></svg></span></div>
</div>

<div class="addrrow">
  <span class="lab">Address</span>
  <div class="addr">
    <svg class="fi"><use href="#i-folder"/></svg>
    <input class="path" id="path" spellcheck="false" autocomplete="off">
    <div class="dd" id="b-places" title="Folders above this one"><svg><use href="#t-drop"/></svg></div>
  </div>
  <div class="go" id="b-go" title="Go"><svg><use href="#t-go"/></svg><span class="lb">Go</span></div>
  <div class="suggest" id="suggest"></div>
  <div class="addr-error" id="addr-error"></div>
</div>

<div class="body">
  <div class="files" id="files" tabindex="0"></div>
</div>

<div class="status">
  <div class="s1" id="st1"></div>
  <div class="s2" id="st2"></div>
  <div class="s3" id="st3"></div>
</div>

<div class="menu" id="menu"></div>
<div class="menu" id="submenu"></div>

<script src="../shared/theme.js"></script>
<script src="window.js"></script>
</body>
</html>
