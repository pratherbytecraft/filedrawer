<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Filedrawer</title>
<link rel="stylesheet" href="window.css">
<link rel="stylesheet" id="theme-css" href="../themes/system.css">
</head>
<body data-pane="tasks">

    </symbol>
    <symbol id="t-forward" viewBox="0 0 24 24">

      <rect x="13" y="3" width="8" height="8" rx="1" fill="#e8b84a" stroke="#b9821b"/>
      <rect x="3" y="13" width="8" height="8" rx="1" fill="#6cc04a" stroke="#2f8a1c"/>
      <rect x="13" y="13" width="8" height="8" rx="1" fill="#d9534f" stroke="#a52a26"/>

      <rect x="2" y="3.5" width="20" height="3.5" rx="1.5" fill="#6b6b6b"/>

      <rect x="10" y="15" width="6" height="1.8" fill="#5be35b"/>
    </symbol>
    <symbol id="p-term" viewBox="0 0 16 16"><use href="#t-term" width="16" height="16"/></symbol>
    <symbol id="p-pin" viewBox="0 0 16 16"><path d="M9.5 1.5l5 5-1.5.5-2.5 2.5.5 3-1 1-3-3-3.5 3.5-.8-.8L6.2 9.7l-3-3 1-1 3 .5L9.7 3.7z" fill="#e2b33b" stroke="#946b0f" stroke-width=".7"/></symbol>
    <symbol id="p-hidden" viewBox="0 0 16 16"><path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8z" fill="#fff" stroke="#6b6b6b" stroke-width=".8"/><circle cx="8" cy="8" r="2.2" fill="#215dc6"/></symbol>
    <symbol id="p-newfolder" viewBox="0 0 16 16"><use href="#i-folder" width="16" height="16"/><path d="M12 1v5M9.5 3.5h5" stroke="#e2a40f" stroke-width="1.5"/></symbol>
    <symbol id="p-rename" viewBox="0 0 16 16"><rect x="1" y="4.5" width="14" height="7" fill="#fff" stroke="#6b6b6b" stroke-width=".7"/><path d="M4 6.5v3M3 6.5h2M3 9.5h2" stroke="#215dc6"/><rect x="6.5" y="7" width="6" height="2" fill="#316ac5"/></symbol>
    <symbol id="p-text" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z" fill="#fff" stroke="#6b6b6b" stroke-width=".7"/><path d="M5 7h6M5 9h6M5 11h4" stroke="#9a9a9a" stroke-width=".7"/></symbol>
    <symbol id="p-copy" viewBox="0 0 16 16"><rect x="2" y="2" width="8" height="10" fill="#fff" stroke="#6b6b6b" stroke-width=".7"/><rect x="6" y="5" width="8" height="10" fill="#fff" stroke="#6b6b6b" stroke-width=".7"/><path d="M8 8h4M8 10h4M8 12h3" stroke="#9a9a9a" stroke-width=".7"/></symbol>
    <symbol id="t-drop" viewBox="0 0 8 8"><path d="M0 2h8L4 6.5z" fill="currentColor"/></symbol>

    <symbol id="p-desktop" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="10" rx="1" fill="#3b7dd8" stroke="#1d4f9a"/><rect x="5" y="13" width="6" height="1.5" fill="#888"/></symbol>
    <symbol id="p-docs" viewBox="0 0 16 16"><use href="#i-folder" width="16" height="16"/><rect x="5" y="7" width="6" height="5" fill="#fff" stroke="#8f8f8f" stroke-width=".5"/></symbol>
    <symbol id="p-down" viewBox="0 0 16 16"><use href="#i-folder" width="16" height="16"/><path d="M8 7v5M5.8 10L8 12.3 10.2 10" stroke="#2f9a1c" stroke-width="1.6" fill="none"/></symbol>
    <symbol id="p-apps" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.3" fill="#e8b84a"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.3" fill="#5b8fe0"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.3" fill="#6cc04a"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.3" fill="#d9534f"/></symbol>

<div class="titlebar">
  <svg class="t-icon" id="title-icon"><use href="#i-folder"/></svg>
  <div class="title" id="title"></div>
</div>

<div class="toolbar">
  <div class="tb off" id="b-back" title="Back"><svg class="ic"><use href="#t-back"/></svg><span class="lb">Back</span><span class="tb-drop" data-drop="back"><svg class="drop"><use href="#t-drop"/></svg></span></div>
  <div class="tb off" id="b-forward" title="Forward"><svg class="ic"><use href="#t-forward"/></svg><span class="tb-drop" data-drop="forward"><svg class="drop"><use href="#t-drop"/></svg></span></div>
  <div class="tb" id="b-up" title="Up"><svg class="ic"><use href="#t-up"/></svg></div>
  <div class="tbsep"></div>
  <div class="tb" id="b-folders" title="Folders"><svg class="ic"><use href="#t-folders"/></svg><span class="lb">Folders</span></div>
  <div class="tbsep"></div>
  <div class="tb" id="b-views" title="Views"><svg class="ic"><use href="#t-views"/></svg><span class="tb-drop"><svg class="drop"><use href="#t-drop"/></svg></span></div>
  <div class="tbsep"></div>
  <div class="tb" id="b-term" title="Open Terminal Here"><svg class="ic"><use href="#t-term"/></svg><span class="lb">Open Terminal Here</span></div>
</div>

<div class="addrrow">
  <span class="lab">Address</span>
  <div class="addr">
    <svg class="fi" id="addr-icon"><use href="#i-folder"/></svg>
    <input class="path" id="path" spellcheck="false" autocomplete="off">
    <div class="dd" id="b-places" title="Folders above this one"><svg><use href="#t-drop"/></svg></div>
  </div>
  <div class="go" id="b-go" title="Go"><svg><use href="#t-go"/></svg><span class="lb">Go</span></div>
  <div class="suggest" id="suggest"></div>
  <div class="addr-error" id="addr-error"></div>
</div>

<div class="body">
  <div class="pane" id="pane"></div>
  <div class="tree" id="tree">
    <div class="head"><span>Folders</span><span class="x" id="tree-close" title="Close">&times;</span></div>
    <div class="tree-list" id="tree-list"></div>
  </div>
  <div class="files" id="files" tabindex="0"></div>
</div>

<div class="status">
  <div class="s1" id="st1"></div>
  <div class="s2" id="st2"></div>
  <div class="s3" id="st3"></div>
</div>

<div class="menu" id="menu"></div>
<div class="menu" id="submenu"></div>

<script src="../shared/theme.js"></script>
<script src="window.js"></script>
<script src="edit.js"></script>
</body>
</html>
