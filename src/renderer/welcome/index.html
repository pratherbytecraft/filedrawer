<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Open folders in Filedrawer?</title>
<link rel="stylesheet" href="../settings/settings.css">
<style>
  body { background: var(--win); }
  [data-appearance="light"] body { background: #f6f6f6; }
  .sheet { height: 100%; display: flex; flex-direction: column; padding: 22px 24px 18px; }
  .head { display: flex; gap: 14px; align-items: flex-start; }
  .head svg { width: 56px; height: 56px; flex: none; }
  h3 { margin: 2px 0 6px; font-size: 14px; }
  p { margin: 0 0 8px; line-height: 1.45; }
  .steps { margin: 12px 0 4px; }
  .steps .row { min-height: 40px; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; padding-top: 16px; }
  .btns .btn { padding: 5px 16px; font-size: 13px; }
  .check { width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; flex: none; background: rgba(127,127,127,.3); color: #fff; font-size: 11px; font-weight: 700; }
  .check.ok { background: #30d158; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="head">
    <svg viewBox="0 0 120 120">
      <defs>
      <linearGradient id="fd-ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120"><stop offset="0%" stop-color="#9fa8ff"/><stop offset="55%" stop-color="#5865F2"/><stop offset="100%" stop-color="#4c46d6"/></linearGradient>
      <linearGradient id="fd-manila" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="90"><stop offset="0%" stop-color="#ffe9a6"/><stop offset="100%" stop-color="#f0a43a"/></linearGradient>
      </defs>
      <g>
      <circle cx="60" cy="60" r="54" fill="#0b0e1a" stroke="url(#fd-ring)" stroke-width="4"/>
      <path d="M24 40 V86 A4 4 0 0 0 28 90 H92 A4 4 0 0 0 96 86 V46 A4 4 0 0 0 92 42 H62 L55 34 H28 A4 4 0 0 0 24 38 Z" fill="url(#fd-manila)"/>
      <path d="M24 50 H96" stroke="#0b0e1a" stroke-opacity=".2" stroke-width="2"/>
      <path d="M60 52 V84" stroke="#5865F2" stroke-width="5" stroke-linecap="round"/>
      <path d="M32 62 H52 M32 72 H48 M68 62 H88 M68 72 H84" stroke="#0b0e1a" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
      </g>
    </svg>
    <div id="text"></div>
  </div>
  <div class="steps group" id="steps" hidden></div>
  <div class="btns" id="btns"></div>
</div>
<script src="welcome.js"></script>
</body>
</html>
